<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual QA – Önce / Sonra</title>
  <style>
    :root { --bg: #F5F3EB; --ink: #2f2a24; --muted: #6f6a60; --line: #e4ddcd; --card: #fff; --accent: #647663; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); }
    header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    h1 { font-size: 1.05rem; margin: 0 12px 0 0; }
    label { font-weight: 600; font-size: .9rem; display: flex; gap: 6px; align-items: center; }
    select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
    main { padding: 16px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
    .row h2 { grid-column: 1 / -1; font-size: 1rem; margin: 0; }
    figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    figcaption { padding: 8px 12px; font-weight: 700; font-size: .85rem; border-bottom: 1px solid var(--line); }
    figure.after figcaption { color: var(--accent); }
    .shot { max-height: 70vh; overflow: auto; }
    .shot img { display: block; width: 100%; height: auto; }
    .missing { padding: 24px; color: var(--muted); }
    @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Visual QA – Önce / Sonra</h1>
    <label>Genişlik <select id="w"></select></label>
    <label>Sayfa <select id="r"><option value="">Tümü</option></select></label>
    <label>Önce <select id="a"></select></label>
    <label>Sonra <select id="b"></select></label>
  </header>
  <main id="out"></main>
  <script>
    // Ekran görüntüleri: qa/screenshots/<etiket>/<genişlik>/<sayfa>.png (npm run qa -- --label=...)
    const slug = (r) => (r.replace(/^#\/?/, '') || 'ana-sayfa').replace(/[^\w-]+/g, '_');
    const $ = (id) => document.getElementById(id);
    fetch('routes.json').then(r => r.json()).then(cfg => {
      $('w').innerHTML = cfg.widths.map(w => `<option>${w}</option>`).join('');
      $('r').innerHTML += cfg.routes.map(r => `<option value="${r}">${r}</option>`).join('');
      const labels = ['once', 'sonra'];
      $('a').innerHTML = labels.map(l => `<option ${l === 'once' ? 'selected' : ''}>${l}</option>`).join('');
      $('b').innerHTML = labels.map(l => `<option ${l === 'sonra' ? 'selected' : ''}>${l}</option>`).join('');
      const draw = () => {
        const w = $('w').value, routes = $('r').value ? [$('r').value] : cfg.routes;
        $('out').innerHTML = routes.map(r => `<section class="row"><h2>${r} · ${w}px</h2>
          ${[['before', $('a').value], ['after', $('b').value]].map(([cls, l]) => `<figure class="${cls}"><figcaption>${l}</figcaption><div class="shot">
            <img loading="lazy" src="screenshots/${l}/${w}/${slug(r)}.png" alt="${r} – ${l} – ${w}px" onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'missing',textContent:'Görüntü yok – önce npm run qa -- --label=${l} çalıştırın.'}))"></div></figure>`).join('')}
        </section>`).join('');
      };
      ['w', 'r', 'a', 'b'].forEach(id => $(id).addEventListener('change', draw));
      draw();
    });
  </script>
</body>
</html>
